  return MONTHS[d.getMonth()] + " " + d.getDate() + "/" + yy;

function headerBadge(item) {
  if (item.isRoad) {
    return `
      <div style="display:flex; align-items:center; gap:12px; background:oklch(0.60 0.14 40); padding:16px 20px; border-radius:17px 17px 0 0;">
        <div style="width:38px; height:38px; border-radius:50%; background:oklch(0.97 0.02 80); flex-shrink:0; position:relative;">
          <div style="position:absolute; inset:9px; border-radius:50%; border:5px solid oklch(0.60 0.14 40);"></div>
        </div>
        <span style="font-family:'Fredoka',sans-serif; font-weight:600; font-size:14px; letter-spacing:1px; color:oklch(0.97 0.02 80);">${item.typeLabel}</span>
      </div>`;
  }
  if (item.isTrail) {
    return `
      <div style="display:flex; align-items:center; gap:12px; background:oklch(0.48 0.10 150); padding:16px 20px; border-radius:17px 17px 0 0;">
        <div style="width:38px; height:38px; border-radius:50%; background:oklch(0.97 0.02 80); flex-shrink:0; position:relative;">
          <div style="position:absolute; left:50%; top:50%; width:0; height:0; transform:translate(-50%,-40%); border-left:9px solid transparent; border-right:9px solid transparent; border-bottom:16px solid oklch(0.48 0.10 150);"></div>
        </div>
        <span style="font-family:'Fredoka',sans-serif; font-weight:600; font-size:14px; letter-spacing:1px; color:oklch(0.97 0.02 80);">${item.typeLabel}</span>
      </div>`;
  }
  if (item.isFondo) {
    return `
      <div style="display:flex; align-items:center; gap:12px; background:oklch(0.48 0.10 230); padding:16px 20px; border-radius:17px 17px 0 0;">
        <div style="width:38px; height:38px; border-radius:50%; background:oklch(0.97 0.02 80); flex-shrink:0; position:relative;">
          <div style="position:absolute; left:6px; top:12px; width:12px; height:12px; border-radius:50%; border:3px solid oklch(0.48 0.10 230);"></div>
          <div style="position:absolute; right:6px; top:12px; width:12px; height:12px; border-radius:50%; border:3px solid oklch(0.48 0.10 230);"></div>
        </div>
        <span style="font-family:'Fredoka',sans-serif; font-weight:600; font-size:14px; letter-spacing:1px; color:oklch(0.97 0.02 80);">${item.typeLabel}</span>
      </div>`;
  }
  return "";
}

        <div style="margin-top:auto; display:flex; gap:10px; padding-top:6px;">
          ${item.hasLink1 ? `<a href="${item.link1Url}" target="_blank" rel="noopener" class="btn-primary" style="font-family:'Fredoka',sans-serif; font-weight:600; font-size:13px; text-decoration:none; color:oklch(0.97 0.02 80); background:oklch(0.24 0.03 45); padding:9px 16px; border-radius:10px;">${item.link1Label} →</a>` : ""}
          ${item.hasLink2 ? `<a href="${item.link2Url}" target="_blank" rel="noopener" class="btn-secondary" style="font-family:'Fredoka',sans-serif; font-weight:600; font-size:13px; text-decoration:none; color:oklch(0.24 0.03 45); background:transparent; border:2.5px solid oklch(0.24 0.03 45); padding:6px 14px; border-radius:10px;">${item.link2Label} →</a>` : ""}
        </div>
      </div>
    </div>`;
}

function completedRowHTML(item) {
  return `
    <div style="display:flex; align-items:center; gap:18px; flex-wrap:wrap; padding:16px 0; border-bottom:2px dashed oklch(0.87 0.015 75);">
      <div style="min-width:74px; font-family:'Fredoka',sans-serif; font-weight:600; font-size:14px; color:oklch(0.5 0.03 45);">${item.dateLabel}</div>
      <div style="width:30px; height:30px; flex-shrink:0; position:relative;">${completedIcon(item)}</div>
      <div style="flex:1; min-width:200px;">
        <div style="font-family:'Fredoka',sans-serif; font-weight:600; font-size:16px;">${item.name}</div>
        <div style="font-size:12px; font-weight:700; color:oklch(0.55 0.03 45); letter-spacing:0.2px;">${item.flag} ${item.location} · ${item.typeLabel}${item.hasDistance ? ` · ${item.distanceLabel}` : ""}</div>
      </div>
      <div style="display:flex; align-items:center; gap:10px; min-width:150px;">
        <div style="position:relative; width:30px; height:38px; flex-shrink:0;">${MEDAL}</div>
        <div style="display:flex; flex-direction:column;">
          <span style="font-family:'Fredoka',sans-serif; font-weight:700; font-size:15px;">${item.finishTime}</span>
          ${item.hasPB ? `<span style="font-size:10px; font-weight:800; letter-spacing:0.5px; color:oklch(0.60 0.14 40);">${item.pbLabel}</span>` : ""}
        </div>
      </div>
      ${item.hasStrava ? `<a href="${item.stravaUrl}" target="_blank" rel="noopener" class="strava-btn" style="font-family:'Fredoka',sans-serif; font-weight:600; font-size:12px; text-decoration:none; color:oklch(0.24 0.03 45); background:transparent; border:2px solid oklch(0.24 0.03 45); padding:6px 12px; border-radius:10px; white-space:nowrap;">Strava ↗</a>` : ""}
    </div>`;
}

function render() {
  const now = Date.now();

  const withComputed = RACE_DATA.map(r => {
    const raceTime = new Date(r.dateISO).getTime();
    const msDiff = raceTime - now;
    const completed = msDiff < 0;
    const daysLeft = Math.max(0, Math.ceil(msDiff / 86400000));
    const weeksNum = Math.floor(daysLeft / 7);
    const bigNumber = String(weeksNum);
    const bigUnitLabel = weeksNum === 1 ? "WEEK TO GO" : "WEEKS TO GO";
    const subCaption = daysLeft + (daysLeft === 1 ? " day out" : " days out");

    return Object.assign({}, r, {
      completed,
      dateLabel: fmtDate(r.dateISO),
      bigNumber, bigUnitLabel, subCaption
    });
  });

  const upcomingSorted = withComputed
    .filter(r => !r.completed)
    .sort((a, b) => new Date(a.dateISO) - new Date(b.dateISO));

  const upcoming = upcomingSorted.map((r, i) => Object.assign({}, r, { isNext: i === 0 }));

  const completed = withComputed
    .filter(r => r.completed)
    .sort((a, b) => new Date(b.dateISO) - new Date(a.dateISO));

  document.getElementById("upcoming-grid").innerHTML = upcoming.map(upcomingCardHTML).join("");
  document.getElementById("completed-list").innerHTML = completed.map(completedRowHTML).join("");
  document.getElementById("completed-count").textContent = completed.length + (completed.length === 1 ? " race" : " races");
}

render();
setInterval(render, 60 * 60 * 1000);
</script>
</body>

</html>
